    <script>
      try {
        var path = location.pathname;
        var management = path.indexOf('/wrs-management') === 0 || path.indexOf('/laundry-management') === 0 || path.indexOf('/overall-sales') === 0;
        var onLogin = path.indexOf('/login') !== -1 || path === '/auth' || path.indexOf('/auth/') === 0;
        var theme = localStorage.getItem('watermarket-admin-theme') || localStorage.getItem('water-chaste-admin-theme');
        if (management && !onLogin && theme === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
